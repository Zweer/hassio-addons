name: Instagram Archive
version: 0.1.1
slug: instagram-archive
description: >-
  Daily Instagram feed archiver. Uses a real (headful) browser to download the
  feed posts of the accounts you follow into a folder tree on /share. Handles
  login challenges via an in-browser noVNC session (Home Assistant ingress).
url: https://github.com/Zweer/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 6080
panel_icon: mdi:instagram
panel_title: IG Archive
map:
  - type: share
    read_only: false
options:
  accounts: []
  challenge_timeout: 180
  backfill_batch_size: 30
  randomize_delay: true
schema:
  accounts:
    - str
  ig_username: str
  ig_password: password
  discord_webhook: url?
  challenge_timeout: int(30,600)
  backfill_batch_size: int(1,200)
  randomize_delay: bool
image: ghcr.io/zweer/hassio-addons/{arch}-instagram-archive
stage: experimental
