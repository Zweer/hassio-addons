name: Social Archiver
version: 0.1.0
slug: social-archiver
description: >-
  Multi-source media archiver. Archives public Instagram profiles (via the
  StoryNavigation mirror) and Pinterest search results to /share. Runs one pass
  per invocation — trigger it once a day from a HA automation. Sends a Discord
  summary of what was downloaded.
url: https://github.com/Zweer/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
map:
  - type: share
    read_only: false
options:
  instagram:
    accounts: []
  pinterest:
    queries: []
    depth: 1
    max_images: 50
    max_queries: 20
  request_delay_ms: 1500
  notify_empty: false
  byparr_url: ''
schema:
  instagram:
    accounts:
      - str
  pinterest:
    queries:
      - str
    depth: int(1,10)
    max_images: int(1,500)
    max_queries: int(1,1000)
  discord_webhook_url: url?
  request_delay_ms: int(0,60000)
  notify_empty: bool
  output_dir: str?
  max_download_mb: int(1,500)?
  byparr_url: url?
  byparr_timeout_ms: int(1000,600000)?
environment: {}
stage: experimental
image: ghcr.io/zweer/hassio-addons/{arch}-social-archiver
