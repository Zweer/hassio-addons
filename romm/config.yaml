name: RomM
version: 0.1.2
slug: romm
description: >-
  Self-hosted ROM library manager & in-browser player (RomM). Scans your
  collection from /share/romm/library, enriches it with metadata/artwork (IGDB,
  ScreenScraper, MobyGames, ...), and lets you play retro games in the browser
  via EmulatorJS. Pairs with the Prowlarr/*arr download flow and the MariaDB
  addon. Tuned for a Raspberry Pi 4 sharing the box with Home Assistant.
url: https://github.com/Zweer/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: RomM web interface — pick a free host port in the Network tab
map:
  - type: share
    read_only: false
options:
  db_host: core-mariadb
  db_port: 3306
  db_name: romm
  db_user: romm
  db_password: ''
  kiosk_mode: false
  https_cookies: false
  igdb_client_id: ''
  igdb_client_secret: ''
  mobygames_api_key: ''
  screenscraper_user: ''
  screenscraper_password: ''
  steamgriddb_api_key: ''
  retroachievements_api_key: ''
  hasheous_api_enabled: true
  emulatorjs_enabled: true
  ruffle_enabled: true
  jsdos_enabled: true
  pico8_enabled: true
  scheduled_rescan: false
  scheduled_rescan_cron: 0 3 * * *
  rescan_on_filesystem_change: false
  scan_workers: 3
  web_server_concurrency: 2
  scan_timeout: 86400
  log_level: INFO
  create_platform_folders:
    - psx
    - ps2
    - n64
    - snes
    - nes
    - gb
    - gbc
    - gba
    - nds
    - genesis
    - sms
    - gamegear
    - saturn
    - segacd
    - psp
    - arcade
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  kiosk_mode: bool
  https_cookies: bool
  igdb_client_id: str?
  igdb_client_secret: password?
  mobygames_api_key: password?
  screenscraper_user: str?
  screenscraper_password: password?
  steamgriddb_api_key: password?
  retroachievements_api_key: password?
  hasheous_api_enabled: bool
  emulatorjs_enabled: bool
  ruffle_enabled: bool
  jsdos_enabled: bool
  pico8_enabled: bool
  scheduled_rescan: bool
  scheduled_rescan_cron: str
  rescan_on_filesystem_change: bool
  scan_workers: int(1,4)
  web_server_concurrency: int(1,9)
  scan_timeout: int(3600,172800)
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  create_platform_folders:
    - str?
environment: {}
backup: hot
backup_exclude:
  - '*.log'
  - logs/
image: ghcr.io/zweer/hassio-addons/{arch}-romm
