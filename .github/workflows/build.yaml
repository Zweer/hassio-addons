name: Build and Publish Addon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      addon:
        description: "Addon to build"
        required: true
        default: "kirocrew"
        type: choice
        options:
          - kirocrew
      version:
        description: "Version tag (e.g. 0.1.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  determine-addon:
    name: Determine which addon to build
    runs-on: ubuntu-latest
    outputs:
      addon: ${{ steps.info.outputs.addon }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse release info
        id: info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Tag format: kirocrew-v0.1.0
            tag="${{ github.event.release.tag_name }}"
            addon="${tag%%-v*}"
            version="${tag##*-v}"
          else
            addon="${{ inputs.addon }}"
            version="${{ inputs.version }}"
          fi
          echo "addon=${addon}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${addon} v${version}"

  build:
    name: Build ${{ matrix.arch }}
    needs: determine-addon
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Map arch to Docker platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            amd64)   echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ needs.determine-addon.outputs.addon }}
          file: ${{ needs.determine-addon.outputs.addon }}/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hassio-addons/${{ matrix.arch }}-${{ needs.determine-addon.outputs.addon }}:${{ needs.determine-addon.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hassio-addons/${{ matrix.arch }}-${{ needs.determine-addon.outputs.addon }}:latest
          build-args: |
            BUILD_VERSION=${{ needs.determine-addon.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Kiro Crew HA Addon
            org.opencontainers.image.version=${{ needs.determine-addon.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  update-config:
    name: Update addon config with image reference
    needs: [determine-addon, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Update config.yaml
        run: |
          addon="${{ needs.determine-addon.outputs.addon }}"
          version="${{ needs.determine-addon.outputs.version }}"
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/hassio-addons/{arch}-${addon}"

          yq -i ".version = \"${version}\"" "${addon}/config.yaml"
          yq -i ".image = \"${image}\"" "${addon}/config.yaml"

          echo "Updated ${addon}/config.yaml:"
          cat "${addon}/config.yaml"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ needs.determine-addon.outputs.addon }}/config.yaml"
          git diff --cached --quiet || {
            git commit -m "ci: update ${{ needs.determine-addon.outputs.addon }} image to v${{ needs.determine-addon.outputs.version }} [skip ci]"
            git push
          }
