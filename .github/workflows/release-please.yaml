name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      kirocrew_released: ${{ steps.release.outputs['kirocrew--release_created'] }}
      kirocrew_version: ${{ steps.release.outputs['kirocrew--version'] }}
      kirocrew_tag: ${{ steps.release.outputs['kirocrew--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          manifest-file: ".release-please-manifest.json"
          config-file: "release-please-config.json"
