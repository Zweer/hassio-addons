name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      addon:
        description: "Addon to build"
        required: true
        default: "kirocrew"
        type: choice
        options:
          - kirocrew
          - zed-remote
      force_build:
        description: "Force build even without a release"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint — only on PRs (gate before merge)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          for f in $(find . -name "*.yaml" -o -name "*.yml" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
          echo "✓ All YAML files valid"

      - name: Validate addon config schema
        run: |
          for dir in */; do
            if [ -f "${dir}config.yaml" ]; then
              echo "Validating ${dir}config.yaml..."
              python3 -c "
          import yaml, sys
          with open('${dir}config.yaml') as f:
              data = yaml.safe_load(f)
          required = ['name', 'version', 'slug', 'description', 'arch']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'ERROR: Missing keys: {missing}')
              sys.exit(1)
          print(f'  ✓ {data[\"name\"]} v{data[\"version\"]} [{\" \".join(data[\"arch\"])}]')
          "
            fi
          done

      - name: Check required files
        run: |
          for dir in */; do
            if [ -f "${dir}config.yaml" ]; then
              echo "Checking ${dir}..."
              [ -f "${dir}Dockerfile" ] && echo "  ✓ Dockerfile" || echo "  ✗ Missing Dockerfile"
              [ -f "${dir}run.sh" ] && echo "  ✓ run.sh" || echo "  ✗ Missing run.sh"
              [ -f "${dir}DOCS.md" ] && echo "  ✓ DOCS.md" || echo "  ⚠ Missing DOCS.md (optional)"
              [ -f "${dir}icon.png" ] && echo "  ✓ icon.png" || echo "  ⚠ Missing icon.png (optional)"
              [ -f "${dir}logo.png" ] && echo "  ✓ logo.png" || echo "  ⚠ Missing logo.png (optional)"
            fi
          done

      - name: Lint shell scripts
        run: |
          for f in $(find . -name "*.sh" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            bash -n "$f" || exit 1
          done
          echo "✓ All shell scripts valid"

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "kirocrew/Dockerfile"
          failure-threshold: warning
          ignore: DL3002,DL3006,DL3008,DL3018,DL3066,SC2015

      - name: Lint Dockerfiles (zed-remote)
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "zed-remote/Dockerfile"
          failure-threshold: warning
          ignore: DL3002,DL3006,DL3008,DL3018,DL3066,SC2015

  # ─────────────────────────────────────────────────────────────
  # Release Please — only on push to main
  # ─────────────────────────────────────────────────────────────
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      kirocrew_released: ${{ steps.release.outputs['kirocrew--release_created'] }}
      kirocrew_version: ${{ steps.release.outputs['kirocrew--version'] }}
      kirocrew_tag: ${{ steps.release.outputs['kirocrew--tag_name'] }}
      zed-remote_released: ${{ steps.release.outputs['zed-remote--release_created'] }}
      zed-remote_version: ${{ steps.release.outputs['zed-remote--version'] }}
      zed-remote_tag: ${{ steps.release.outputs['zed-remote--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: ".release-please-manifest.json"
          config-file: "release-please-config.json"

  # ─────────────────────────────────────────────────────────────
  # Build matrix — determines which addons to build
  # ─────────────────────────────────────────────────────────────
  prepare-build:
    name: Prepare build matrix
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.kirocrew_released == 'true' ||
        needs.release-please.outputs['zed-remote_released'] == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Build matrix
        id: matrix
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ADDON: ${{ inputs.addon }}
          KIROCREW_RELEASED: ${{ needs.release-please.outputs.kirocrew_released }}
          KIROCREW_VERSION: ${{ needs.release-please.outputs.kirocrew_version }}
          ZED_REMOTE_RELEASED: ${{ needs.release-please.outputs['zed-remote_released'] }}
          ZED_REMOTE_VERSION: ${{ needs.release-please.outputs['zed-remote_version'] }}
        with:
          script: |
            const addons = [];
            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              addons.push(process.env.INPUT_ADDON);
            } else {
              if (process.env.KIROCREW_RELEASED === 'true') addons.push('kirocrew');
              if (process.env.ZED_REMOTE_RELEASED === 'true') addons.push('zed-remote');
            }
            const matrix = {
              include: addons.flatMap(addon => [
                { addon, arch: 'aarch64', platform: 'linux/arm64' },
                { addon, arch: 'amd64', platform: 'linux/amd64' }
              ])
            };
            console.log('Build matrix:', JSON.stringify(matrix, null, 2));
            return matrix;

  # ─────────────────────────────────────────────────────────────
  # Build — parallel builds for each addon × arch
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: [release-please, prepare-build]
    if: always() && needs.prepare-build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare-build.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          addon="${{ matrix.addon }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(python3 -c "import yaml; print(yaml.safe_load(open('${addon}/config.yaml'))['version'])")
          else
            case "${addon}" in
              kirocrew)   version="${{ needs.release-please.outputs.kirocrew_version }}" ;;
              zed-remote) version="${{ needs.release-please.outputs['zed-remote_version'] }}" ;;
            esac
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "addon=${addon}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "Building ${addon} v${version} for ${{ matrix.arch }} (owner: ${owner})"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.version.outputs.addon }}
          file: ${{ steps.version.outputs.addon }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ steps.version.outputs.addon }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ steps.version.outputs.addon }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ matrix.addon }} HA Addon
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ─────────────────────────────────────────────────────────────
  # Update config.yaml with image reference after build
  # ─────────────────────────────────────────────────────────────
  update-config:
    name: Update config (${{ matrix.addon }})
    needs: [release-please, build]
    if: |
      always() && needs.build.result == 'success' && (
        needs.release-please.outputs.kirocrew_released == 'true' ||
        needs.release-please.outputs['zed-remote_released'] == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - addon: kirocrew
            released: ${{ needs.release-please.outputs.kirocrew_released }}
            version: ${{ needs.release-please.outputs.kirocrew_version }}
          - addon: zed-remote
            released: ${{ needs.release-please.outputs['zed-remote_released'] }}
            version: ${{ needs.release-please.outputs['zed-remote_version'] }}
    steps:
      - name: Skip if not released
        if: matrix.released != 'true'
        run: echo "Skipping ${{ matrix.addon }} — not released"

      - name: Checkout
        if: matrix.released == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update config.yaml
        if: matrix.released == 'true'
        run: |
          addon="${{ matrix.addon }}"
          version="${{ matrix.version }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${owner}/hassio-addons/{arch}-${addon}"

          sed -i "s/^version: .*/version: ${version}/" "${addon}/config.yaml"
          sed -i "s|^image: .*|image: ${image}|" "${addon}/config.yaml"

          echo "Updated ${addon}/config.yaml:"
          cat "${addon}/config.yaml"

      - name: Commit and push
        if: matrix.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.addon }}/config.yaml"
          git diff --cached --quiet || {
            git commit -m "ci: update ${{ matrix.addon }} image to v${{ matrix.version }} [skip ci]"
            git push
          }
