name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      addon:
        description: "Addon to build"
        required: true
        default: "kirocrew"
        type: choice
        options:
          - kirocrew
          - zed-remote
      force_build:
        description: "Force build even without a release"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint — only on PRs (gate before merge)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          for f in $(find . -name "*.yaml" -o -name "*.yml" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
          echo "✓ All YAML files valid"

      - name: Validate addon config schema
        run: |
          for dir in */; do
            if [ -f "${dir}config.yaml" ]; then
              echo "Validating ${dir}config.yaml..."
              python3 -c "
          import yaml, sys
          with open('${dir}config.yaml') as f:
              data = yaml.safe_load(f)
          required = ['name', 'version', 'slug', 'description', 'arch']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'ERROR: Missing keys: {missing}')
              sys.exit(1)
          print(f'  ✓ {data[\"name\"]} v{data[\"version\"]} [{\" \".join(data[\"arch\"])}]')
          "
            fi
          done

      - name: Check required files
        run: |
          for dir in */; do
            if [ -f "${dir}config.yaml" ]; then
              echo "Checking ${dir}..."
              [ -f "${dir}Dockerfile" ] && echo "  ✓ Dockerfile" || echo "  ✗ Missing Dockerfile"
              [ -f "${dir}run.sh" ] && echo "  ✓ run.sh" || echo "  ✗ Missing run.sh"
              [ -f "${dir}DOCS.md" ] && echo "  ✓ DOCS.md" || echo "  ⚠ Missing DOCS.md (optional)"
              [ -f "${dir}icon.png" ] && echo "  ✓ icon.png" || echo "  ⚠ Missing icon.png (optional)"
              [ -f "${dir}logo.png" ] && echo "  ✓ logo.png" || echo "  ⚠ Missing logo.png (optional)"
            fi
          done

      - name: Lint shell scripts
        run: |
          for f in $(find . -name "*.sh" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            bash -n "$f" || exit 1
          done
          echo "✓ All shell scripts valid"

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "kirocrew/Dockerfile"
          failure-threshold: warning
          ignore: DL3002,DL3006,DL3008,DL3018,DL3066,SC2015

      - name: Lint Dockerfiles (zed-remote)
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "zed-remote/Dockerfile"
          failure-threshold: warning
          ignore: DL3002,DL3006,DL3008,DL3018,DL3066,SC2015

  # ─────────────────────────────────────────────────────────────
  # Release Please — only on push to main
  # ─────────────────────────────────────────────────────────────
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      kirocrew_released: ${{ steps.release.outputs['kirocrew--release_created'] }}
      kirocrew_version: ${{ steps.release.outputs['kirocrew--version'] }}
      kirocrew_tag: ${{ steps.release.outputs['kirocrew--tag_name'] }}
      zed-remote_released: ${{ steps.release.outputs['zed-remote--release_created'] }}
      zed-remote_version: ${{ steps.release.outputs['zed-remote--version'] }}
      zed-remote_tag: ${{ steps.release.outputs['zed-remote--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: ".release-please-manifest.json"
          config-file: "release-please-config.json"

  # ─────────────────────────────────────────────────────────────
  # Build (on release) — triggered only when release-please creates a release
  # ─────────────────────────────────────────────────────────────
  build-on-release:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - addon: kirocrew
            arch: aarch64
            platform: linux/arm64
            released: ${{ needs.release-please.outputs.kirocrew_released }}
            version: ${{ needs.release-please.outputs.kirocrew_version }}
          - addon: kirocrew
            arch: amd64
            platform: linux/amd64
            released: ${{ needs.release-please.outputs.kirocrew_released }}
            version: ${{ needs.release-please.outputs.kirocrew_version }}
          - addon: zed-remote
            arch: aarch64
            platform: linux/arm64
            released: ${{ needs.release-please.outputs['zed-remote_released'] }}
            version: ${{ needs.release-please.outputs['zed-remote_version'] }}
          - addon: zed-remote
            arch: amd64
            platform: linux/amd64
            released: ${{ needs.release-please.outputs['zed-remote_released'] }}
            version: ${{ needs.release-please.outputs['zed-remote_version'] }}
    steps:
      - name: Skip if not released
        if: matrix.released != 'true'
        run: |
          echo "Skipping ${{ matrix.addon }} (${{ matrix.arch }}) — not released this run"
          exit 0

      - name: Checkout
        if: matrix.released == 'true'
        uses: actions/checkout@v7

      - name: Set image metadata
        if: matrix.released == 'true'
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.addon }} v${{ matrix.version }} for ${{ matrix.arch }}"

      - name: Login to GHCR
        if: matrix.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.released == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: matrix.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: matrix.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.addon }}
          file: ${{ matrix.addon }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ matrix.addon }}:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ matrix.addon }}:latest
          build-args: |
            BUILD_VERSION=${{ matrix.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ matrix.addon }} HA Addon
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ─────────────────────────────────────────────────────────────
  # Build (manual) — workflow_dispatch with force_build
  # ─────────────────────────────────────────────────────────────
  build-manual:
    name: Build ${{ inputs.addon }} (${{ matrix.arch }}) [manual]
    if: github.event_name == 'workflow_dispatch' && inputs.force_build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - aarch64
          - amd64
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          addon="${{ inputs.addon }}"
          version=$(python3 -c "import yaml; print(yaml.safe_load(open('${addon}/config.yaml'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "Building ${addon} v${version} for ${{ matrix.arch }} (owner: ${owner})"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.addon }}
          file: ${{ inputs.addon }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ inputs.addon }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ inputs.addon }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ inputs.addon }} HA Addon
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ─────────────────────────────────────────────────────────────
  # Update config.yaml with image reference after release build
  # ─────────────────────────────────────────────────────────────
  update-config:
    name: Update config
    needs: [release-please, build-on-release]
    if: needs.release-please.outputs.releases_created == 'true' && needs.build-on-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update released addon configs
        env:
          KIROCREW_RELEASED: ${{ needs.release-please.outputs.kirocrew_released }}
          KIROCREW_VERSION: ${{ needs.release-please.outputs.kirocrew_version }}
          ZED_REMOTE_RELEASED: ${{ needs.release-please.outputs['zed-remote_released'] }}
          ZED_REMOTE_VERSION: ${{ needs.release-please.outputs['zed-remote_version'] }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          updated=false

          if [ "${KIROCREW_RELEASED}" = "true" ]; then
            image="${{ env.REGISTRY }}/${owner}/hassio-addons/{arch}-kirocrew"
            sed -i "s/^version: .*/version: ${KIROCREW_VERSION}/" "kirocrew/config.yaml"
            sed -i "s|^image: .*|image: ${image}|" "kirocrew/config.yaml"
            git add "kirocrew/config.yaml"
            echo "✓ Updated kirocrew to v${KIROCREW_VERSION}"
            updated=true
          fi

          if [ "${ZED_REMOTE_RELEASED}" = "true" ]; then
            image="${{ env.REGISTRY }}/${owner}/hassio-addons/{arch}-zed-remote"
            sed -i "s/^version: .*/version: ${ZED_REMOTE_VERSION}/" "zed-remote/config.yaml"
            sed -i "s|^image: .*|image: ${image}|" "zed-remote/config.yaml"
            git add "zed-remote/config.yaml"
            echo "✓ Updated zed-remote to v${ZED_REMOTE_VERSION}"
            updated=true
          fi

          if [ "${updated}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git diff --cached --quiet || {
              git commit -m "ci: update addon image references [skip ci]"
              git push
            }
          fi
