name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      addon:
        description: "Addon to build"
        required: true
        default: "kirocrew"
        type: choice
        options:
          - kirocrew
      force_build:
        description: "Force build even without a release"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint — only on PRs (gate before merge)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate YAML syntax
        run: |
          for f in $(find . -name "*.yaml" -o -name "*.yml" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
          echo "✓ All YAML files valid"

      - name: Validate addon config schema
        run: |
          for dir in */; do
            if [ -f "${dir}config.yaml" ]; then
              echo "Validating ${dir}config.yaml..."
              python3 -c "
          import yaml, sys
          with open('${dir}config.yaml') as f:
              data = yaml.safe_load(f)
          required = ['name', 'version', 'slug', 'description', 'arch']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'ERROR: Missing keys: {missing}')
              sys.exit(1)
          print(f'  ✓ {data[\"name\"]} v{data[\"version\"]} [{\" \".join(data[\"arch\"])}]')
          "
            fi
          done

      - name: Check required files
        run: |
          for dir in */; do
            if [ -f "${dir}config.yaml" ]; then
              echo "Checking ${dir}..."
              [ -f "${dir}Dockerfile" ] && echo "  ✓ Dockerfile" || echo "  ✗ Missing Dockerfile"
              [ -f "${dir}run.sh" ] && echo "  ✓ run.sh" || echo "  ✗ Missing run.sh"
              [ -f "${dir}DOCS.md" ] && echo "  ✓ DOCS.md" || echo "  ⚠ Missing DOCS.md (optional)"
              [ -f "${dir}icon.png" ] && echo "  ✓ icon.png" || echo "  ⚠ Missing icon.png (optional)"
              [ -f "${dir}logo.png" ] && echo "  ✓ logo.png" || echo "  ⚠ Missing logo.png (optional)"
            fi
          done

      - name: Lint shell scripts
        run: |
          for f in $(find . -name "*.sh" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            bash -n "$f" || exit 1
          done
          echo "✓ All shell scripts valid"

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "kirocrew/Dockerfile"
          failure-threshold: warning
          ignore: DL3006,DL3008,DL3018,SC2015

  # ─────────────────────────────────────────────────────────────
  # Release Please — only on push to main
  # ─────────────────────────────────────────────────────────────
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      kirocrew_released: ${{ steps.release.outputs['kirocrew--release_created'] }}
      kirocrew_version: ${{ steps.release.outputs['kirocrew--version'] }}
      kirocrew_tag: ${{ steps.release.outputs['kirocrew--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          manifest-file: ".release-please-manifest.json"
          config-file: "release-please-config.json"

  # ─────────────────────────────────────────────────────────────
  # Build — after release-please creates a release, or on manual dispatch
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.arch }}
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.kirocrew_released == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(python3 -c "import yaml; print(yaml.safe_load(open('${{ inputs.addon }}/config.yaml'))['version'])")
            addon="${{ inputs.addon }}"
          else
            version="${{ needs.release-please.outputs.kirocrew_version }}"
            addon="kirocrew"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "addon=${addon}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "Building ${addon} v${version} for ${{ matrix.arch }} (owner: ${owner})"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Map arch to Docker platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            amd64)   echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.version.outputs.addon }}
          file: ${{ steps.version.outputs.addon }}/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ steps.version.outputs.addon }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/hassio-addons/${{ matrix.arch }}-${{ steps.version.outputs.addon }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Kiro Crew HA Addon
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ─────────────────────────────────────────────────────────────
  # Update config.yaml with image reference after build
  # ─────────────────────────────────────────────────────────────
  update-config:
    name: Update config with image
    needs: [release-please, build]
    if: needs.release-please.outputs.kirocrew_released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Update config.yaml
        run: |
          addon="kirocrew"
          version="${{ needs.release-please.outputs.kirocrew_version }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${owner}/hassio-addons/{arch}-${addon}"

          yq -i ".version = \"${version}\"" "${addon}/config.yaml"
          yq -i ".image = \"${image}\"" "${addon}/config.yaml"

          echo "Updated ${addon}/config.yaml:"
          cat "${addon}/config.yaml"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "kirocrew/config.yaml"
          git diff --cached --quiet || {
            git commit -m "ci: update kirocrew image to v${{ needs.release-please.outputs.kirocrew_version }} [skip ci]"
            git push
          }
