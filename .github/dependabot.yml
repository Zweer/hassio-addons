version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"

  # Docker (base images in Dockerfiles)
  - package-ecosystem: "docker"
    directory: "/kirocrew"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(kirocrew)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/instagram-archive"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(instagram-archive)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # npm (instagram-archive scraper dependencies)
  - package-ecosystem: "npm"
    directory: "/instagram-archive"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(instagram-archive)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
