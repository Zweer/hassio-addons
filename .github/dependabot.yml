version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"

  # Docker (base images in Dockerfiles)
  - package-ecosystem: "docker"
    directory: "/kirocrew"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(kirocrew)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
