name: Lares Bot
version: 0.2.0
slug: lares-bot
description: >-
  Automated strategy bot for Lares. Runs 24/7 on your Home Assistant hardware,
  managing builds, troops, faith powers, and resource optimization.
url: https://github.com/Zweer/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
map:
  - type: share
    read_only: false
ports:
  8099/tcp: null
watchdog: http://[HOST]:[PORT:8099]/health
options:
  lares_poll_interval: 20
  node_max_old_space_size: 64
schema:
  github_pat: password?
  lares_api_url: url?
  lares_token: password?
  lares_village_id: str?
  lares_poll_interval: int(5,120)
  discord_webhook_url: url?
  node_max_old_space_size: int(32,512)
environment: {}
stage: experimental
image: ghcr.io/zweer/hassio-addons/{arch}-lares-bot
