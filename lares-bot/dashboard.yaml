## Lares Bot — Home Assistant Dashboard
## Sostituisci VILLAGE con il tuo lares_village_id

title: Lares Bot
views:
  - title: Overview
    path: overview
    icon: mdi:sword-cross

    badges:
      - type: entity
        entity: sensor.lares_bot_VILLAGE_sustenance
        name: Food
        color: green
      - type: entity
        entity: sensor.lares_bot_VILLAGE_materia
        name: Materia
        color: blue-grey
      - type: entity
        entity: sensor.lares_bot_VILLAGE_lore
        name: Lore
        color: purple
      - type: entity
        entity: sensor.lares_bot_VILLAGE_trade_goods
        name: Trade
        color: amber
      - type: entity
        entity: sensor.lares_bot_VILLAGE_faith
        name: Faith
        color: cyan
      - type: entity
        entity: sensor.lares_bot_VILLAGE_army_power
        name: Army
        color: red
      - type: entity
        entity: sensor.lares_bot_VILLAGE_morale
        name: Morale
        color: green
      - type: entity
        entity: sensor.lares_bot_VILLAGE_wall_hp
        name: Walls
        color: orange

    cards:
      # ── Alert: attacchi in arrivo (visibile SOLO se > 0) ───────
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.lares_bot_VILLAGE_incoming_attacks
            above: 0
        card:
          type: tile
          entity: sensor.lares_bot_VILLAGE_incoming_attacks
          name: "🚨 INCOMING ATTACKS"
          color: red
          icon: mdi:alert-octagon

      # ── Stato attuale ──────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: entities
            title: "🔨 Build"
            entities:
              - entity: sensor.lares_bot_VILLAGE_current_build
                name: Current
                icon: mdi:progress-wrench
              - entity: sensor.lares_bot_VILLAGE_build_eta
                name: ETA
                icon: mdi:timer-sand
                format: relative
              - entity: sensor.lares_bot_VILLAGE_build_queue
                name: Queue
                icon: mdi:playlist-play

          - type: entities
            title: "⚡ Powers"
            entities:
              - entity: sensor.lares_bot_VILLAGE_active_buffs
                name: Active Buffs
                icon: mdi:lightning-bolt
              - entity: sensor.lares_bot_VILLAGE_festival_cooldown
                name: Festival
                icon: mdi:party-popper
                format: relative
              - entity: sensor.lares_bot_VILLAGE_sacrifice_cooldown
                name: Sacrifice
                icon: mdi:knife
                format: relative

      # ── Operations (solo se c'è qualcosa in volo) ──────────────
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.lares_bot_VILLAGE_outgoing_raids
            above: 0
        card:
          type: entities
          title: "📡 In Flight"
          entities:
            - entity: sensor.lares_bot_VILLAGE_outgoing_raids
              name: Raids
              icon: mdi:sword
            - entity: sensor.lares_bot_VILLAGE_outgoing_scouts
              name: Scouts
              icon: mdi:eye

      # ── Grafici andamento ──────────────────────────────────────
      - type: history-graph
        title: "📈 Resources"
        hours_to_show: 24
        entities:
          - entity: sensor.lares_bot_VILLAGE_sustenance
            name: Food
          - entity: sensor.lares_bot_VILLAGE_materia
            name: Materia
          - entity: sensor.lares_bot_VILLAGE_lore
            name: Lore
          - entity: sensor.lares_bot_VILLAGE_trade_goods
            name: Trade Goods

      - type: history-graph
        title: "📈 Faith & Army"
        hours_to_show: 24
        entities:
          - entity: sensor.lares_bot_VILLAGE_faith
            name: Faith
          - entity: sensor.lares_bot_VILLAGE_army_power
            name: Army Power
