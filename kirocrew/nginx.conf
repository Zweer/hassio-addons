server {
    listen 5477 default_server;

    # Disable buffering for WebSocket support (ingress_stream: true)
    proxy_buffering off;

    location / {
        absolute_redirect off;

        proxy_pass http://127.0.0.1:5476;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Pass through headers
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite redirects
        proxy_redirect '/' $http_x_ingress_path/;

        # Rewrite absolute paths in HTML responses
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/'    'href="$http_x_ingress_path/';
        sub_filter 'src="/'     'src="$http_x_ingress_path/';
        sub_filter "href='/"    "href='$http_x_ingress_path/";
        sub_filter "src='/"     "src='$http_x_ingress_path/";
        sub_filter 'url(/'      'url($http_x_ingress_path/';
        sub_filter '"/api/'     '"$http_x_ingress_path/api/';
        sub_filter "'/api/"     "'$http_x_ingress_path/api/";
        sub_filter 'fetch("/'   'fetch("$http_x_ingress_path/';
        sub_filter "fetch('/"   "fetch('$http_x_ingress_path/";
        sub_filter_once off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
