---
configuration:
  session_pool_size:
    name: Sessioni Concorrenti
    description: >-
      Numero massimo di sessioni agente simultanee. Mantieni a 1 per RPi4
      con 4GB RAM. Ogni sessione usa ~500MB-1GB. Aumenta solo con 8GB+ RAM.
  telemetry:
    name: Telemetria Anonima
    description: >-
      Invia un heartbeat anonimo giornaliero ai maintainer di Kiro Crew.
      Nessun prompt, codice o dato personale viene mai inviato.
  log_level:
    name: Livello di Log
    description: >-
      Verbosità dei log del gateway. Usa 'debug' per troubleshooting,
      'info' per operazione normale.
  cloudflare_tunnel_token:
    name: Token Cloudflare Tunnel
    description: >-
      Token da Cloudflare Zero Trust per esporre la dashboard esternamente
      senza aprire porte. Crea un tunnel su dash.cloudflare.com →
      Zero Trust → Networks → Tunnels. Lascia vuoto per disabilitare.
  cloudflare_tunnel_hostname:
    name: Hostname Cloudflare Tunnel
    description: >-
      L'hostname pubblico assegnato al tunnel (es. kiro.nidoran.click).
      Usato per configurare gli host consentiti dalla dashboard. Obbligatorio
      se imposti un token del tunnel.
