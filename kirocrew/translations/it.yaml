---
configuration:
  session_pool_size:
    name: Sessioni Concorrenti
    description: >-
      Numero massimo di sessioni agente simultanee. Mantieni a 1 per RPi4
      con 4GB RAM. Ogni sessione usa ~500MB-1GB. Aumenta solo con 8GB+ RAM.
  telemetry:
    name: Telemetria Anonima
    description: >-
      Invia un heartbeat anonimo giornaliero ai maintainer di Kiro Crew.
      Nessun prompt, codice o dato personale viene mai inviato.
  log_level:
    name: Livello di Log
    description: >-
      Verbosità dei log del gateway. Usa 'debug' per troubleshooting,
      'info' per operazione normale.
  kiro_api_key:
    name: Kiro API Key
    description: >-
      API key da app.kiro.dev (Settings → API Keys). Abilita l'autenticazione
      headless — non serve fare 'kiro-cli login' manualmente. La chiave
      non scade.
  external_url:
    name: URL Esterno
    description: >-
      L'URL pubblico usato per accedere a Kiro Crew (es. https://kiro.example.com).
      Impostalo quando usi l'addon Cloudflared per HA o un reverse proxy.
      Serve per autorizzare l'header Host delle richieste in arrivo. Lascia
      vuoto per rilevarlo automaticamente dalla configurazione di HA.
