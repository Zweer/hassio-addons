---
configuration:
  session_pool_size:
    name: Session Pool Size
    description: >-
      Maximum concurrent agent sessions. Keep at 1 for RPi4 with 4GB RAM.
      Each session uses ~500MB-1GB. Increase only if you have 8GB+ RAM.
  telemetry:
    name: Anonymous Telemetry
    description: >-
      Send one anonymous heartbeat per day to Kiro Crew maintainers.
      No prompts, code, or personal data is ever sent.
  log_level:
    name: Log Level
    description: >-
      Gateway log verbosity. Use 'debug' for troubleshooting,
      'info' for normal operation.
  kiro_api_key:
    name: Kiro API Key
    description: >-
      API key from app.kiro.dev (Settings → API Keys). Enables headless
      authentication — no manual device-code login needed. Written to
      Crew's .env file so both the gateway and agents use it automatically.
  external_url:
    name: External URL
    description: >-
      The public URL used to access Kiro Crew (e.g. https://kiro.example.com).
      Set this when using the Cloudflared HA addon or any reverse proxy.
      Used to allow the Host header for incoming requests. Leave empty to
      auto-detect from HA configuration.
  telegram_bot_token:
    name: Telegram Bot Token
    description: >-
      Token from @BotFather on Telegram. Create a bot with /newbot and
      paste the token here. Leave empty to disable Telegram integration.
  telegram_allowed_user_ids:
    name: Telegram Allowed User IDs
    description: >-
      Comma-separated list of numeric Telegram user IDs allowed to chat
      with the bot (e.g. 123456789,987654321). Get your ID by messaging
      @userinfobot on Telegram.
  discord_bot_token:
    name: Discord Bot Token
    description: >-
      Token from the Discord Developer Portal. Create an application,
      add a bot, and copy the token here.
  discord_allowed_user_ids:
    name: Discord Allowed User IDs
    description: >-
      Comma-separated list of Discord user IDs allowed to chat with
      the bot (e.g. 123456789012345678,987654321098765432). Enable
      Developer Mode in Discord settings, then right-click your
      profile → Copy User ID.
  slack_bot_token:
    name: Slack Bot Token
    description: >-
      Bot token (xoxb-...) from your Slack app's OAuth & Permissions page.
  slack_app_token:
    name: Slack App Token
    description: >-
      App-level token (xapp-...) for Socket Mode. Generate it in your
      Slack app under Basic Information → App-Level Tokens.
  slack_owner_id:
    name: Slack Owner ID
    description: >-
      Your Slack Member ID (the only user the bot will respond to).
      Find it in Slack: click your profile → More → Copy Member ID.
