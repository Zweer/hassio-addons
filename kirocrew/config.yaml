name: Kiro Crew
version: 0.3.0
slug: kirocrew
description: >-
  Persistent AI development workspace that self-improves and continues beyond
  one session. Runs agents, scheduled jobs, and long-running tasks on your Home
  Assistant hardware.
url: https://github.com/Zweer/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  5476/tcp: 5476
ports_description:
  5476/tcp: Kiro Crew dashboard
webui: http://[HOST]:[PORT:5476]
homeassistant_api: true
map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true
watchdog: http://[HOST]:[PORT:5476]/api/health
timeout: 120
options:
  telemetry: false
  log_level: info
  session_timeout_secs: 900
  watchdog_rss_max_mb: 1536
  embedding_idle_evict_secs: 300
  embedding_weight_repack: false
  telegram_allowed_user_ids: []
  discord_allowed_user_ids: []
schema:
  telemetry: bool
  log_level: list(debug|info|warning|error)
  session_timeout_secs: int(60,86400)
  watchdog_rss_max_mb: int(0,16384)
  embedding_idle_evict_secs: int(0,86400)
  embedding_weight_repack: bool
  kiro_api_key: password?
  external_url: url?
  telegram_bot_token: password?
  telegram_allowed_user_ids:
    - int
  discord_bot_token: password?
  discord_allowed_user_ids:
    - str
  slack_bot_token: password?
  slack_app_token: password?
  slack_owner_id: str?
backup: hot
backup_exclude:
  - '*.log'
  - home/.kiro/crew/models
  - home/.kiro/crew/logs
stage: experimental
image: ghcr.io/zweer/hassio-addons/{arch}-kirocrew
