name: Kiro Crew
version: 0.1.13
slug: kirocrew
description: >-
  Persistent AI development workspace that self-improves and continues beyond one session. Runs agents, scheduled jobs, and long-running tasks on your Home Assistant hardware.
url: https://github.com/Zweer/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 5476
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: Kiro Crew
panel_admin: true
hassio_api: true
map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true
watchdog: http://[HOST]:[PORT:5476]/
timeout: 120
options:
  session_pool_size: 1
  telemetry: false
  log_level: info
schema:
  session_pool_size: int(1,4)
  telemetry: bool
  log_level: list(debug|info|warning|error)
environment:
  KIROCREW_PORT: '5476'
backup: hot
backup_exclude:
  - '*.log'
  - models/
stage: experimental
image: ghcr.io/zweer/hassio-addons/{arch}-kirocrew
