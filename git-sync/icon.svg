<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Git Sync">
  <rect width="512" height="512" rx="96" fill="#1b2430"/>
  <!-- sync arrows forming a loop -->
  <g fill="none" stroke="#f05133" stroke-width="26" stroke-linecap="round">
    <path d="M150 200 a112 112 0 0 1 196 -30"/>
    <path d="M362 312 a112 112 0 0 1 -196 30"/>
  </g>
  <!-- arrow heads -->
  <g fill="#f05133">
    <path d="M346 130 l30 44 -52 6 z"/>
    <path d="M166 382 l-30 -44 52 -6 z"/>
  </g>
  <!-- git commit nodes on the axis -->
  <g fill="#ffffff">
    <circle cx="256" cy="256" r="30"/>
    <circle cx="256" cy="150" r="18"/>
    <circle cx="256" cy="362" r="18"/>
  </g>
  <line x1="256" y1="150" x2="256" y2="362" stroke="#ffffff" stroke-width="12"/>
</svg>
